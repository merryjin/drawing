<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pattern Lab</title>

<style>

body,html{
margin:0;
height:100%;
font-family:-apple-system,BlinkMacSystemFont,system-ui;
background:#ddd;
overflow:hidden;
}

/* 패턴 배경 */

#pattern{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background-repeat:repeat;
background-size:200px;
background-color:#ddd;
}

/* 드롭 안내 */

#drop{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
border:4px dashed rgba(0,0,0,0.15);
background:rgba(255,255,255,0.3);
font-weight:600;
color:#555;
z-index:10;
}

/* 패널 */

.panel{
position:fixed;
top:20px;
left:20px;
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
z-index:100;
}

</style>

</head>

<body>

<div id="pattern"></div>

<div id="drop">
패턴 이미지를 드래그하세요
</div>

<div class="panel">

<label>Scale</label> <br> <input type="range" id="scale" min="20" max="1000" value="200">

</div>

<script>

const pattern=document.getElementById("pattern")
const drop=document.getElementById("drop")
const scale=document.getElementById("scale")

let image=null

/* 드래그 기본동작 방지 */

;["dragenter","dragover","dragleave","drop"].forEach(e=>{
document.addEventListener(e,ev=>{
ev.preventDefault()
})
})

/* 드롭 */

document.addEventListener("drop",e=>{

const file=e.dataTransfer.files[0]

if(!file) return

if(!file.type.startsWith("image")){
alert("이미지 파일만 가능합니다")
return
}

const reader=new FileReader()

reader.onload=function(ev){

image=ev.target.result

pattern.style.backgroundImage=`url(${image})`
pattern.style.backgroundRepeat="repeat"
pattern.style.backgroundSize=scale.value+"px"

drop.style.display="none"

}

reader.readAsDataURL(file)

})

/* 스케일 */

scale.addEventListener("input",()=>{

if(image){
pattern.style.backgroundSize=scale.value+"px"
}

})

</script>

</body>
</html>
