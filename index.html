<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pattern Drag & Drop Viewer</title>

<style>

:root {
--bg-size: 200px;
}

body, html {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
font-family: -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
overflow: hidden;
}

/* 패턴 배경 */

#pattern-background {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background-repeat: repeat;
background-size: var(--bg-size);
background-position: center;
z-index: -1;
background-color: #e5e5e5;
transition: background-image 0.3s ease;
}

/* 드래그 안내 */

#drop-zone-overlay {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
display: flex;
justify-content: center;
align-items: center;
background: rgba(0,0,0,0.05);
border: 4px dashed rgba(0,0,0,0.1);
box-sizing: border-box;
z-index: 10;
pointer-events: none;
opacity: 1;
transition: opacity 0.3s;
}

#drop-zone-overlay.hidden {
opacity: 0;
}

.instruction-text {
background: rgba(255,255,255,0.8);
padding: 20px 40px;
border-radius: 50px;
font-weight: bold;
color: #555;
box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

/* 컨트롤 패널 */

.control-panel {
position: fixed;
top: 20px;
left: 20px;
background: rgba(255,255,255,0.95);
padding: 24px;
border-radius: 16px;
box-shadow: 0 8px 30px rgba(0,0,0,0.15);
backdrop-filter: blur(10px);
width: 260px;
z-index: 100;
}

h2 {
margin: 0 0 20px 0;
font-size: 20px;
color: #222;
}

.control-group {
margin-bottom: 20px;
}

label {
display: block;
font-size: 13px;
font-weight: 600;
margin-bottom: 10px;
color: #444;
}

input[type="range"] {
width: 100%;
height: 6px;
background: #ddd;
border-radius: 5px;
outline: none;
-webkit-appearance: none;
}

input[type="range"]::-webkit-slider-thumb {
-webkit-appearance: none;
width: 18px;
height: 18px;
background: #333;
border-radius: 50%;
cursor: pointer;
}

.file-info {
font-size: 12px;
color: #888;
margin-top: 10px;
line-height: 1.5;
}

</style>

</head>

<body>

<div id="pattern-background"></div>

<div id="drop-zone-overlay">
<div class="instruction-text">이곳에 패턴 이미지를 드래그하세요</div>
</div>
