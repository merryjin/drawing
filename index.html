<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Pattern Lab PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,system-ui;
background:#eee;
}

.wrapper{
display:flex;
height:100vh;
}

.panel{
width:260px;
background:white;
padding:20px;
box-shadow:2px 0 10px rgba(0,0,0,0.1);
}

.control{
margin-bottom:14px;
}

label{
font-size:12px;
font-weight:600;
}

input,select{
width:100%;
margin-top:4px;
}

button{
width:100%;
padding:8px;
margin-top:6px;
border:none;
background:#333;
color:white;
border-radius:6px;
}

.workspace{
flex:1;
display:flex;
flex-direction:column;
}

.tileView{
height:200px;
display:flex;
align-items:center;
justify-content:center;
background:#fafafa;
border-bottom:1px solid #ddd;
}

.patternView{
flex:1;
position:relative;
background:#ddd;
}

canvas{
display:block;
}

#grid{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;

background-image:
linear-gradient(rgba(0,0,0,0.15) 1px, transparent 1px),
linear-gradient(90deg, rgba(0,0,0,0.15) 1px, transparent 1px);

background-size:200px 200px;

display:none;
}

#drop{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;

display:flex;
align-items:center;
justify-content:center;

font-size:22px;
font-weight:600;

border:4px dashed rgba(0,0,0,0.2);
background:rgba(255,255,255,0.5);
}

</style>

</head>

<body>

<div class="wrapper">

<div class="panel">

<h3>Pattern Lab PRO</h3>

<div class="control">
<label>Upload Pattern</label>
<input type="file" id="upload" accept="image/*">
</div>

<div class="control">
<label>Scale</label>
<input type="range" id="scale" min="50" max="300" value="150">
</div>

<div class="control">
<label>Offset X</label>
<input type="range" id="offsetX" min="0" max="200" value="0">
</div>

<div class="control">
<label>Offset Y</label>
<input type="range" id="offsetY" min="0" max="200" value="0">
</div>

<div class="control">
<label>Repeat Mode</label>
<select id="repeatMode">
<option value="basic">Basic</option>
<option value="half">Half Drop</option>
<option value="brick">Brick</option>
</select>
</div>

<div class="control">
<label>Background</label>
<input type="color" id="bgColor" value="#dddddd">
</div>

<button id="toggleGrid">Grid Toggle</button> <button id="exportBtn">Export PNG</button>

</div>

<div class="workspace">

<div class="tileView">
<canvas id="tileCanvas" width="180" height="180"></canvas>
</div>

<div class="patternView">

<canvas id="patternCanvas"></canvas>

<div id="grid"></div>

<div id="drop">이미지를 업로드하세요</div>

</div>

</div>

</div>

<script>

const upload=document.getElementById("upload")
const patternCanvas=document.getElementById("patternCanvas")
const tileCanvas=document.getElementById("tileCanvas")

const ctx=patternCanvas.getContext("2d")
const tileCtx=tileCanvas.getContext("2d")

const scale=document.getElementById("scale")
const offsetX=document.getElementById("offsetX")
const offsetY=document.getElementById("offsetY")
const repeatMode=document.getElementById("repeatMode")
const bgColor=document.getElementById("bgColor")

const drop=document.getElementById("drop")

let img=null

function resizeCanvas(){

patternCanvas.width=patternCanvas.parentElement.clientWidth
patternCanvas.height=patternCanvas.parentElement.clientHeight

draw()

}

window.addEventListener("resize",resizeCanvas)

upload.onchange=e=>{

const file=e.target.files[0]

if(!file) return

const reader=new FileReader()

reader.onload=function(ev){

img=new Image()

img.onload=function(){

drop.style.display="none"
draw()

}

img.src=ev.target.result

}

reader.readAsDataURL(file)

}

function draw(){

if(!img) return

const w=patternCanvas.width
const h=patternCanvas.height

ctx.fillStyle=bgColor.value
ctx.fillRect(0,0,w,h)

const size=Number(scale.value)

tileCtx.clearRect(0,0,180,180)
tileCtx.drawImage(img,0,0,180,180)

for(let x=-size;x<w+size;x+=size){

for(let y=-size;y<h+size;y+=size){

let dx=x+Number(offsetX.value)
let dy=y+Number(offsetY.value)

if(repeatMode.value==="half"){

if(Math.floor(x/size)%2===0) dy+=size/2

}

if(repeatMode.value==="brick"){

if(Math.floor(y/size)%2===0) dx+=size/2

}

ctx.drawImage(img,dx,dy,size,size)

}

}

}

scale.oninput=draw
offsetX.oninput=draw
offsetY.oninput=draw
repeatMode.onchange=draw
bgColor.oninput=draw

document.getElementById("toggleGrid").onclick=()=>{

const grid=document.getElementById("grid")

grid.style.display=grid.style.display==="none"?"block":"none"

}

document.getElementById("exportBtn").onclick=()=>{

const link=document.createElement("a")

link.download="pattern.png"
link.href=patternCanvas.toDataURL()

link.click()

}

resizeCanvas()

</script>

</body>
</html>
